apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  labels:
    app: mongodb-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo
        ports:
        - containerPort: 27017
        env:
          - name: MONGO_INITDB_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                name: mongo-secret                          # line 4 of mongo-secret.yml
                key: mongo-root-username                # line 7 of mongo-secret.ym
          - name: MONGO_INITDB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mongo-secret
                key: mongo-root-password   
        resources:
          limits:
            memory: "512Mi"
            cpu: "800m"

--- 

apiVersion: v1
kind: Service  
metadata:
  name: mongodb-service
spec:
  selector:
    app: mongodb # match line 15
  ports:
  - port: 27017
    protocol: TCP
    targetPort: 27017  # match line 21


