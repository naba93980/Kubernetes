apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongoexpress-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      restartPolicy: Always
      containers:
      - name: mongo-express
        image: mongo-express:0.42
        ports:
        - containerPort: 8081
        env:
          - name: ME_CONFIG_MONGODB_ADMINUSERNAME 
            valueFrom:
              secretKeyRef:
                name: mongo-secret                      # line 4 of mongo-secret.yml 
                key: mongo-root-username            
          - name: ME_CONFIG_MONGODB_ADMINPASSWORD
            valueFrom:
              secretKeyRef:
                name: mongo-secret                      # line 4 of mongo-secret.yml
                key: mongo-root-password
          - name: ME_CONFIG_MONGODB_SERVER
            valueFrom:
              configMapKeyRef:
                name: mongodb-configmap           # line 4 of mongo-configmap.yml
                key: database_url                          # line 6 of mongo-configmap.yml
          - name: ME_CONFIG_MONGODB_ENABLE_ADMIN
            value: "true"
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"

--- 

apiVersion: v1
kind: Service  
metadata:
  name: mongodb-express-service
spec:
  selector:
    app: mongo-express
  type: LoadBalancer
  ports:
  - port: 80                # internal service ip port
    protocol: TCP
    targetPort: 8081
    nodePort: 30001  # external service ip port

