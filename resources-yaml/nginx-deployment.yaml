apiVersion: apps/v1
kind: Deployment

metadata:     # deployment metadata
  name: nginx-deployment
  labels:
    app: nginx

spec: # spec for deployment
  replicas: 2
  selector: # match labels of pods
    matchLabels:
      app: nginx

  template: # blueprint for pod to be created
    metadata:
      labels:
        app: nginx
    spec: # spec for pod
      containers:
        - name: nginx-container
          image: nginx
          resources: {}
          ports:
            - containerPort: 80
        
